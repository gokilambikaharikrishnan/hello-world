<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMS DocGen — Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --muted:    #8b949e;
      --text:     #e6edf3;
      --blue:     #58a6ff;
      --green:    #3fb950;
      --purple:   #bc8cff;
      --teal:     #2ea19a;
      --orange:   #d29922;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    /* ── scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── shared layout ── */
    .section { padding: 80px 24px; max-width: 1000px; margin: 0 auto; }
    .section-label {
      font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 12px;
    }
    .section-title {
      font-size: 1.6rem; font-weight: 700; color: var(--text); margin-bottom: 40px;
    }
    .divider { border: none; border-top: 1px solid var(--border); margin: 0; }

    /* ── fade-in animation on scroll ── */
    .fade-in { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .fade-in.visible { opacity: 1; transform: none; }
  </style>
</head>
<body>
  <!-- ── HERO ── -->
  <header style="background:var(--surface);border-bottom:1px solid var(--border);padding:80px 24px 60px;text-align:center;">
    <div style="font-size:0.75rem;letter-spacing:0.25em;color:var(--blue);text-transform:uppercase;margin-bottom:16px;">
      ⚡ BMS DocGen
    </div>
    <h1 style="font-size:2.4rem;font-weight:700;color:var(--text);margin-bottom:16px;line-height:1.2;">
      Architecture &amp; Design
    </h1>
    <p style="font-size:0.95rem;color:var(--muted);max-width:560px;margin:0 auto 32px;">
      A VS Code extension that auto-generates engineering documentation for BMS firmware
      using GitHub Copilot — triggered on every successful IAR build.
    </p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <span style="background:#161b22;border:1px solid var(--border);padding:4px 14px;border-radius:20px;font-size:0.78rem;color:var(--muted);">STM32 · LFP · 14S</span>
      <span style="background:#161b22;border:1px solid #238636;padding:4px 14px;border-radius:20px;font-size:0.78rem;color:var(--green);">GitHub Copilot</span>
      <span style="background:#161b22;border:1px solid #1f6feb;padding:4px 14px;border-radius:20px;font-size:0.78rem;color:var(--blue);">VS Code Extension</span>
      <span style="background:#161b22;border:1px solid #6e40c9;padding:4px 14px;border-radius:20px;font-size:0.78rem;color:var(--purple);">7 Doc Modes</span>
    </div>
  </header>
  <hr class="divider" />

  <!-- sections added next -->
  <script>
    // Intersection observer for fade-in
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); } });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>
</body>
</html>
