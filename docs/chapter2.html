<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 2: Understanding the Li-ion Cell | LFP BMS Knowledge Base</title>
  <style>
    /* ============================================================
       RESET & ROOT VARIABLES
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deep:        #07090f;
      --bg-card:        #0d1117;
      --bg-card2:       #111827;
      --bg-glass:       rgba(255,255,255,0.03);
      --border:         rgba(255,255,255,0.08);
      --border-bright:  rgba(99,179,237,0.35);
      --text-primary:   #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted:     #4a5568;
      --accent-blue:    #63b3ed;
      --accent-cyan:    #00d9ff;
      --accent-green:   #48bb78;
      --accent-orange:  #ed8936;
      --accent-red:     #fc8181;
      --accent-purple:  #b794f4;
      --accent-gold:    #f6e05e;
      --accent-teal:    #38b2ac;
      --lfp-color:      #48bb78;
      --nmc-color:      #63b3ed;
      --lead-color:     #94a3b8;
      --nicad-color:    #ed8936;
      --nimh-color:     #b794f4;
      --nca-color:      #fc8181;
      --font-mono:      'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --font-sans:      'Inter', 'Segoe UI', system-ui, sans-serif;
      --radius-sm:      6px;
      --radius-md:      12px;
      --radius-lg:      20px;
      --shadow-glow:    0 0 40px rgba(99,179,237,0.12);
      --transition:     all 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    /* ============================================================
       BASE & TYPOGRAPHY
    ============================================================ */
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.7;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 3px; }
    ::selection { background: rgba(99,179,237,0.25); color: #fff; }
    h1,h2,h3,h4,h5 { font-weight:700; letter-spacing:-0.02em; line-height:1.25; }
    p { margin-bottom:1.2rem; color:var(--text-secondary); }
    strong { color:var(--text-primary); font-weight:600; }
    em { color:var(--accent-cyan); font-style:italic; }
    code {
      font-family:var(--font-mono); font-size:0.88em;
      background:rgba(99,179,237,0.12); color:var(--accent-cyan);
      padding:2px 6px; border-radius:4px; border:1px solid rgba(99,179,237,0.2);
    }
    a { color:var(--accent-blue); text-decoration:none; }
    a:hover { color:var(--accent-cyan); }
    sup { font-size:0.72em; color:var(--accent-cyan); }

    /* ============================================================
       LAYOUT
    ============================================================ */
    .page-wrapper { display:flex; min-height:100vh; }

    .sidebar {
      width:280px; min-width:280px;
      background:var(--bg-card); border-right:1px solid var(--border);
      position:sticky; top:0; height:100vh; overflow-y:auto;
      padding:2rem 1.5rem; display:flex; flex-direction:column; gap:0.5rem;
    }
    .sidebar-logo {
      font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase;
      color:var(--accent-cyan); font-family:var(--font-mono);
      margin-bottom:1.5rem; padding-bottom:1.5rem; border-bottom:1px solid var(--border);
    }
    .sidebar-logo span { display:block; font-size:1.1rem; color:var(--text-primary); margin-top:0.25rem; font-family:var(--font-sans); letter-spacing:-0.02em; font-weight:700; }
    .sidebar-nav-label {
      font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase;
      color:var(--text-muted); font-family:var(--font-mono);
      margin-top:1rem; margin-bottom:0.25rem; padding-left:0.5rem;
    }
    .sidebar-link {
      display:flex; align-items:center; gap:0.6rem;
      padding:0.5rem 0.75rem; border-radius:var(--radius-sm);
      color:var(--text-secondary); font-size:0.875rem; transition:var(--transition);
      cursor:pointer; border:1px solid transparent; text-decoration:none;
    }
    .sidebar-link:hover, .sidebar-link.active {
      background:rgba(99,179,237,0.08); color:var(--accent-blue); border-color:rgba(99,179,237,0.15);
    }
    .sidebar-link .dot { width:6px; height:6px; border-radius:50%; background:var(--text-muted); flex-shrink:0; transition:var(--transition); }
    .sidebar-link:hover .dot, .sidebar-link.active .dot { background:var(--accent-blue); box-shadow:0 0 8px var(--accent-blue); }
    .sidebar-sub { padding-left:1.5rem; font-size:0.82rem; color:var(--text-muted); }

    .main-content { flex:1; max-width:900px; margin:0 auto; padding:4rem 3rem; }
    @media (max-width:1024px) { .sidebar { display:none; } .main-content { padding:2rem 1.5rem; } }

    /* ============================================================
       HERO
    ============================================================ */
    .hero { position:relative; padding:5rem 0 4rem; margin-bottom:4rem; overflow:hidden; }
    .hero::before { content:''; position:absolute; top:-100px; left:-200px; width:600px; height:600px; background:radial-gradient(circle, rgba(72,187,120,0.06) 0%, transparent 70%); pointer-events:none; }
    .hero::after { content:''; position:absolute; bottom:0; left:0; right:0; height:1px; background:linear-gradient(90deg, transparent, rgba(72,187,120,0.4), transparent); }
    .hero-badge { display:inline-flex; align-items:center; gap:0.5rem; background:rgba(72,187,120,0.08); border:1px solid rgba(72,187,120,0.2); border-radius:100px; padding:0.35rem 1rem; font-size:0.78rem; font-family:var(--font-mono); color:var(--accent-green); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:1.5rem; }
    .hero-badge::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--accent-green); box-shadow:0 0 8px var(--accent-green); animation:pulse-dot 2s infinite; }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
    .hero-chapter { font-family:var(--font-mono); font-size:0.85rem; color:var(--text-muted); letter-spacing:0.08em; margin-bottom:0.75rem; }
    .hero-title { font-size:clamp(2.5rem,5vw,4rem); font-weight:800; letter-spacing:-0.03em; line-height:1.1; margin-bottom:1.5rem; background:linear-gradient(135deg, #fff 0%, var(--accent-green) 40%, var(--accent-cyan) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .hero-subtitle { font-size:1.2rem; color:var(--text-secondary); max-width:700px; line-height:1.65; margin-bottom:2.5rem; }
    .hero-meta { display:flex; gap:2rem; flex-wrap:wrap; }
    .hero-meta-item { display:flex; flex-direction:column; gap:0.25rem; }
    .hero-meta-label { font-size:0.72rem; font-family:var(--font-mono); color:var(--text-muted); letter-spacing:0.1em; text-transform:uppercase; }
    .hero-meta-value { font-size:0.92rem; color:var(--text-secondary); font-weight:500; }
    .hero-meta-value.highlight { color:var(--accent-green); font-weight:700; }

    /* ============================================================
       SECTION HEADERS
    ============================================================ */
    .section { margin-bottom:5rem; }
    .section-number { font-family:var(--font-mono); font-size:0.78rem; color:var(--accent-cyan); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.75rem; }
    .section-number::after { content:''; height:1px; width:40px; background:var(--accent-cyan); opacity:0.4; }
    .section-title { font-size:clamp(1.6rem,3vw,2.25rem); font-weight:700; color:var(--text-primary); margin-bottom:0.75rem; letter-spacing:-0.025em; }
    .section-intro { font-size:1.05rem; color:var(--text-secondary); max-width:720px; margin-bottom:3rem; line-height:1.75; border-left:3px solid rgba(99,179,237,0.3); padding-left:1.25rem; }
    .subsection { margin-top:3rem; margin-bottom:2.5rem; }
    .subsection-title { font-size:1.25rem; font-weight:700; color:var(--text-primary); margin-bottom:1rem; display:flex; align-items:center; gap:0.75rem; }
    .subsection-title::before { content:''; width:4px; height:20px; border-radius:2px; background:var(--accent-green); flex-shrink:0; }
    .subsection-sub { font-size:1.05rem; font-weight:700; color:var(--text-primary); margin:1.5rem 0 0.75rem; padding-left:1rem; border-left:2px solid rgba(72,187,120,0.3); }
