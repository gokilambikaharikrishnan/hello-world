<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 1: The Case for Li-ion | LFP BMS Knowledge Base</title>
  <style>
    /* ============================================================
       RESET & ROOT VARIABLES
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deep:        #07090f;
      --bg-card:        #0d1117;
      --bg-card2:       #111827;
      --bg-glass:       rgba(255,255,255,0.03);
      --border:         rgba(255,255,255,0.08);
      --border-bright:  rgba(99,179,237,0.35);
      --text-primary:   #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted:     #4a5568;
      --accent-blue:    #63b3ed;
      --accent-cyan:    #00d9ff;
      --accent-green:   #48bb78;
      --accent-orange:  #ed8936;
      --accent-red:     #fc8181;
      --accent-purple:  #b794f4;
      --accent-gold:    #f6e05e;
      --lfp-color:      #48bb78;
      --nmc-color:      #63b3ed;
      --lead-color:     #94a3b8;
      --nicad-color:    #ed8936;
      --nimh-color:     #b794f4;
      --nca-color:      #fc8181;
      --font-mono:      'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --font-sans:      'Inter', 'Segoe UI', system-ui, sans-serif;
      --radius-sm:      6px;
      --radius-md:      12px;
      --radius-lg:      20px;
      --shadow-glow:    0 0 40px rgba(99,179,237,0.12);
      --transition:     all 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    /* ============================================================
       BASE TYPOGRAPHY & SCROLLBAR
    ============================================================ */
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.7;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 3px; }
    ::selection { background: rgba(99,179,237,0.25); color: #fff; }

    h1, h2, h3, h4, h5 {
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    p { margin-bottom: 1.2rem; color: var(--text-secondary); }
    strong { color: var(--text-primary); font-weight: 600; }
    em { color: var(--accent-cyan); font-style: italic; }
    code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: rgba(99,179,237,0.12);
      color: var(--accent-cyan);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(99,179,237,0.2);
    }
    a { color: var(--accent-blue); text-decoration: none; }
    a:hover { color: var(--accent-cyan); }

    /* ============================================================
       LAYOUT STRUCTURE
    ============================================================ */
    .page-wrapper { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .sidebar-logo {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo span { display: block; font-size: 1.1rem; color: var(--text-primary); margin-top: 0.25rem; font-family: var(--font-sans); letter-spacing: -0.02em; font-weight: 700; }
    .sidebar-nav-label {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-top: 1rem;
      margin-bottom: 0.25rem;
      padding-left: 0.5rem;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 0.875rem;
      transition: var(--transition);
      cursor: pointer;
      border: 1px solid transparent;
    }
    .sidebar-link:hover, .sidebar-link.active {
      background: rgba(99,179,237,0.08);
      color: var(--accent-blue);
      border-color: rgba(99,179,237,0.15);
    }
    .sidebar-link .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      transition: var(--transition);
    }
    .sidebar-link:hover .dot, .sidebar-link.active .dot { background: var(--accent-blue); box-shadow: 0 0 8px var(--accent-blue); }
    .sidebar-sub {
      padding-left: 1.5rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Main content */
    .main-content {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 3rem;
    }
    @media (max-width: 1024px) {
      .sidebar { display: none; }
      .main-content { padding: 2rem 1.5rem; }
    }

    /* ============================================================
       HERO SECTION
    ============================================================ */
    .hero {
      position: relative;
      padding: 5rem 0 4rem;
      margin-bottom: 4rem;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -100px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(99,179,237,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-bright), transparent);
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(99,179,237,0.08);
      border: 1px solid rgba(99,179,237,0.2);
      border-radius: 100px;
      padding: 0.35rem 1rem;
      font-size: 0.78rem;
      font-family: var(--font-mono);
      color: var(--accent-cyan);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .hero-badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    .hero-chapter {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
    }
    .hero-title {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #fff 0%, var(--accent-blue) 50%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-subtitle {
      font-size: 1.2rem;
      color: var(--text-secondary);
      max-width: 680px;
      line-height: 1.65;
      margin-bottom: 2.5rem;
    }
    .hero-meta {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .hero-meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .hero-meta-label {
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .hero-meta-value {
      font-size: 0.92rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .hero-meta-value.highlight { color: var(--accent-green); font-weight: 700; }

    /* ============================================================
       SECTION HEADERS
    ============================================================ */
    .section {
      margin-bottom: 5rem;
    }
    .section-number {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--accent-cyan);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .section-number::after {
      content: '';
      height: 1px;
      width: 40px;
      background: var(--accent-cyan);
      opacity: 0.4;
    }
    .section-title {
      font-size: clamp(1.6rem, 3vw, 2.25rem);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
      letter-spacing: -0.025em;
    }
    .section-intro {
      font-size: 1.05rem;
      color: var(--text-secondary);
      max-width: 720px;
      margin-bottom: 3rem;
      line-height: 1.75;
      border-left: 3px solid rgba(99,179,237,0.3);
      padding-left: 1.25rem;
    }
    .subsection {
      margin-top: 3rem;
      margin-bottom: 2.5rem;
    }
    .subsection-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .subsection-title::before {
      content: '';
      width: 4px; height: 20px;
      border-radius: 2px;
      background: var(--accent-blue);
      flex-shrink: 0;
    }

    /* ============================================================
       CARDS
    ============================================================ */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin-bottom: 1.5rem;
      transition: var(--transition);
    }
    .card:hover {
      border-color: rgba(99,179,237,0.25);
      box-shadow: var(--shadow-glow);
      transform: translateY(-2px);
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .card-icon {
      width: 44px; height: 44px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      flex-shrink: 0;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .card-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* ============================================================
       TIMELINE
    ============================================================ */
    .timeline {
      position: relative;
      padding-left: 2rem;
      margin: 2.5rem 0;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 0; top: 8px; bottom: 8px;
      width: 2px;
      background: linear-gradient(180deg,
        var(--accent-blue) 0%,
        var(--accent-cyan) 30%,
        var(--accent-green) 70%,
        var(--accent-purple) 100%);
      border-radius: 1px;
    }
    .timeline-item {
      position: relative;
      padding: 0 0 2.5rem 1.75rem;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -2.425rem;
      top: 6px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--bg-deep);
      border: 2px solid var(--accent-blue);
      box-shadow: 0 0 12px rgba(99,179,237,0.4);
      transition: var(--transition);
    }
    .timeline-item:hover::before {
      background: var(--accent-blue);
      box-shadow: 0 0 20px rgba(99,179,237,0.7);
    }
    .timeline-year {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--accent-cyan);
      letter-spacing: 0.08em;
      margin-bottom: 0.35rem;
    }
    .timeline-heading {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    .timeline-body { color: var(--text-secondary); font-size: 0.93rem; }
    .timeline-stats {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }
    .timeline-stat {
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.35rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.77rem;
      color: var(--text-muted);
    }
    .timeline-stat span { color: var(--accent-blue); font-weight: 600; }
    .timeline-verdict {
      margin-top: 0.75rem;
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      border-left: 3px solid;
    }
    .verdict-fail { background: rgba(252,129,129,0.06); border-color: var(--accent-red); color: var(--accent-red); }
    .verdict-partial { background: rgba(237,137,54,0.06); border-color: var(--accent-orange); color: var(--accent-orange); }
    .verdict-good { background: rgba(72,187,120,0.06); border-color: var(--accent-green); color: var(--accent-green); }

    /* ============================================================
       COMPARISON TABLE
    ============================================================ */
    .table-wrapper {
      overflow-x: auto;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      margin: 2rem 0;
    }
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    .comparison-table thead {
      background: var(--bg-card2);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .comparison-table th {
      padding: 1rem 1.25rem;
      text-align: left;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    .comparison-table th.col-lfp { color: var(--lfp-color); }
    .comparison-table th.col-nmc { color: var(--nmc-color); }
    .comparison-table th.col-lead { color: var(--lead-color); }
    .comparison-table th.col-nicad { color: var(--nicad-color); }
    .comparison-table th.col-nimh { color: var(--nimh-color); }
    .comparison-table th.col-nca { color: var(--nca-color); }
    .comparison-table td {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: var(--text-secondary);
      vertical-align: top;
    }
    .comparison-table tbody tr:last-child td { border-bottom: none; }
    .comparison-table tbody tr:hover td { background: rgba(255,255,255,0.02); }
    .comparison-table .metric-name {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .comparison-table .metric-unit {
      display: block;
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      margin-top: 2px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: var(--font-mono);
      white-space: nowrap;
    }
    .badge-green  { background: rgba(72,187,120,0.15);  color: var(--lfp-color); }
    .badge-blue   { background: rgba(99,179,237,0.15);  color: var(--nmc-color); }
    .badge-gray   { background: rgba(148,163,184,0.15); color: var(--lead-color); }
    .badge-orange { background: rgba(237,137,54,0.15);  color: var(--nicad-color); }
    .badge-purple { background: rgba(183,148,244,0.15); color: var(--nimh-color); }
    .badge-red    { background: rgba(252,129,129,0.15); color: var(--nca-color); }
    .badge-gold   { background: rgba(246,224,94,0.15);  color: var(--accent-gold); }
    .best { color: var(--accent-green); font-weight: 700; }
    .worst { color: var(--accent-red); font-weight: 700; }
    .good { color: var(--accent-blue); }
    .fair { color: var(--accent-orange); }

    /* ============================================================
       CALLOUT BOXES
    ============================================================ */
    .callout {
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      margin: 2rem 0;
      display: flex;
      gap: 1rem;
      border: 1px solid;
    }
    .callout-icon { font-size: 1.4rem; flex-shrink: 0; line-height: 1.5; }
    .callout-body { flex: 1; }
    .callout-title { font-weight: 700; font-size: 0.92rem; margin-bottom: 0.4rem; }
    .callout p { margin-bottom: 0; font-size: 0.9rem; }
    .callout-info    { background: rgba(99,179,237,0.06);   border-color: rgba(99,179,237,0.25);   }
    .callout-info    .callout-title { color: var(--accent-blue); }
    .callout-warning { background: rgba(237,137,54,0.06);   border-color: rgba(237,137,54,0.25);   }
    .callout-warning .callout-title { color: var(--accent-orange); }
    .callout-danger  { background: rgba(252,129,129,0.06);  border-color: rgba(252,129,129,0.25);  }
    .callout-danger  .callout-title { color: var(--accent-red); }
    .callout-success { background: rgba(72,187,120,0.06);   border-color: rgba(72,187,120,0.25);   }
    .callout-success .callout-title { color: var(--accent-green); }
    .callout-physics { background: rgba(183,148,244,0.06);  border-color: rgba(183,148,244,0.25);  }
    .callout-physics .callout-title { color: var(--accent-purple); }

    /* ============================================================
       STAT GRID
    ============================================================ */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin: 2rem 0;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      text-align: center;
      transition: var(--transition);
      cursor: default;
    }
    .stat-card:hover {
      border-color: rgba(99,179,237,0.3);
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3), 0 0 20px rgba(99,179,237,0.08);
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      font-family: var(--font-mono);
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 0.35rem;
    }
    .stat-unit {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      display: block;
      margin-bottom: 0.5rem;
    }
    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ============================================================
       TRACEABILITY DIAGRAM
    ============================================================ */
    .trace-container {
      margin: 2.5rem 0;
    }
    .trace-row {
      display: grid;
      grid-template-columns: 1fr 60px 1fr;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .trace-weakness {
      background: rgba(252,129,129,0.07);
      border: 1px solid rgba(252,129,129,0.2);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
    }
    .trace-weakness-title {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--accent-red);
      margin-bottom: 0.25rem;
    }
    .trace-weakness-body {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .trace-arrow {
      text-align: center;
      color: var(--text-muted);
      font-size: 1.2rem;
    }
    .trace-feature {
      background: rgba(72,187,120,0.07);
      border: 1px solid rgba(72,187,120,0.2);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
    }
    .trace-feature-title {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--accent-green);
      margin-bottom: 0.25rem;
    }
    .trace-feature-body {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* ============================================================
       ELECTROCHEMISTRY DIAGRAMS
    ============================================================ */
    .crystal-diagram {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin: 2rem 0;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .crystal-diagram::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(72,187,120,0.04) 0%, transparent 70%);
    }

    /* ============================================================
       PROGRESS BAR & FILL INDICATOR
    ============================================================ */
    .progress-bar-wrap {
      background: rgba(255,255,255,0.05);
      border-radius: 100px;
      height: 6px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 1s ease;
    }

    /* ============================================================
       CHAPTER FOOTER / NAV
    ============================================================ */
    .chapter-footer {
      margin-top: 6rem;
      padding-top: 3rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 2rem;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.9rem;
      transition: var(--transition);
      cursor: pointer;
    }
    .nav-btn:hover {
      border-color: rgba(99,179,237,0.35);
      color: var(--accent-blue);
      background: rgba(99,179,237,0.05);
      transform: translateY(-2px);
    }
    .nav-btn-next { background: rgba(99,179,237,0.08); border-color: rgba(99,179,237,0.25); color: var(--accent-blue); }
    .nav-btn-next:hover { background: rgba(99,179,237,0.15); box-shadow: 0 4px 20px rgba(99,179,237,0.2); }

    /* Formula display */
    .formula-block {
      background: var(--bg-card2);
      border: 1px solid rgba(183,148,244,0.2);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.75rem;
      margin: 1.5rem 0;
      font-family: var(--font-mono);
      font-size: 1.05rem;
      color: var(--accent-purple);
      text-align: center;
      letter-spacing: 0.03em;
    }
    .formula-block .formula-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 0.5rem;
    }
    .formula-block .formula-caption {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: var(--font-sans);
      margin-top: 0.5rem;
      display: block;
    }

    /* Animated number counter */
    .counter { display: inline-block; }

    /* Tooltip */
    [data-tip] { position: relative; cursor: help; border-bottom: 1px dashed rgba(99,179,237,0.4); }
    [data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card2);
      border: 1px solid var(--border-bright);
      color: var(--text-primary);
      font-size: 0.78rem;
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-sm);
      white-space: nowrap;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    /* Highlight box for key insight */
    .insight-box {
      background: linear-gradient(135deg, rgba(99,179,237,0.06) 0%, rgba(0,217,255,0.03) 100%);
      border: 1px solid rgba(99,179,237,0.2);
      border-radius: var(--radius-lg);
      padding: 1.75rem 2rem;
      margin: 2rem 0;
      position: relative;
      overflow: hidden;
    }
    .insight-box::before {
      content: '"';
      position: absolute;
      top: -0.5rem; left: 1rem;
      font-size: 6rem;
      color: rgba(99,179,237,0.08);
      font-family: Georgia, serif;
      line-height: 1;
      pointer-events: none;
    }
    .insight-box p { color: var(--text-primary); font-size: 1.02rem; line-height: 1.7; margin-bottom: 0; font-style: italic; }
    .insight-box cite { display: block; font-size: 0.8rem; color: var(--text-muted); margin-top: 0.75rem; font-style: normal; }

    /* List styles */
    .content-list { list-style: none; padding: 0; margin: 1.25rem 0 1.5rem; }
    .content-list li {
      padding: 0.5rem 0 0.5rem 1.75rem;
      position: relative;
      color: var(--text-secondary);
      font-size: 0.93rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .content-list li:last-child { border-bottom: none; }
    .content-list li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: var(--accent-blue);
      font-size: 0.8rem;
      top: 0.6rem;
    }
    .content-list.check li::before { content: '✓'; color: var(--accent-green); }
    .content-list.cross li::before { content: '✗'; color: var(--accent-red); }

    /* ============================================================
       SVG DIAGRAM STYLES
    ============================================================ */
    .svg-wrap {
      width: 100%;
      overflow-x: auto;
      margin: 2rem 0;
    }
    svg text { font-family: var(--font-sans); }

    /* ============================================================
       INTERACTIVE BAR CHART
    ============================================================ */
    .bar-chart-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem 2rem;
      margin: 2rem 0;
    }
    .bar-chart-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.35rem;
    }
    .bar-chart-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-family: var(--font-mono);
    }
    .bar-chart-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .bar-chart-tab {
      padding: 0.3rem 0.85rem;
      border-radius: 100px;
      font-size: 0.78rem;
      font-family: var(--font-mono);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
    }
    .bar-chart-tab:hover { border-color: rgba(99,179,237,0.3); color: var(--accent-blue); }
    .bar-chart-tab.active { background: rgba(99,179,237,0.12); border-color: rgba(99,179,237,0.35); color: var(--accent-blue); }
    .bar-chart-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.85rem;
    }
    .bar-label {
      width: 90px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: right;
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border-radius: 100px;
      height: 22px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 100px;
      display: flex;
      align-items: center;
      padding-left: 0.5rem;
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: rgba(0,0,0,0.7);
      font-weight: 700;
      transition: width 1s cubic-bezier(0.4,0,0.2,1);
      white-space: nowrap;
    }
    .bar-value {
      width: 80px;
      font-size: 0.82rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* ============================================================
       CHAPTER NAVIGATION TOC
    ============================================================ */
    .toc-card {
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem 2rem;
      margin-bottom: 4rem;
    }
    .toc-title {
      font-size: 0.78rem;
      font-family: var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }
    .toc-items { display: flex; flex-direction: column; gap: 0.5rem; }
    .toc-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.6rem 0.85rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }
    .toc-item:hover { background: rgba(99,179,237,0.06); }
    .toc-num {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      min-width: 32px;
    }
    .toc-text {
      font-size: 0.88rem;
      color: var(--text-secondary);
      flex: 1;
    }
    .toc-text strong { color: var(--text-primary); display: block; font-size: 0.9rem; }
    .toc-arrow { color: var(--text-muted); font-size: 0.9rem; }

    /* ============================================================
       PRINT STYLES
    ============================================================ */
    @media print {
      .sidebar, .chapter-footer { display: none; }
      body { background: white; color: black; }
      .main-content { padding: 1cm; }
    }
