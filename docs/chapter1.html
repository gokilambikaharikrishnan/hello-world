<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 1: The Case for Li-ion | LFP BMS Knowledge Base</title>
  <style>
    /* ============================================================
       RESET & ROOT VARIABLES
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deep:        #07090f;
      --bg-card:        #0d1117;
      --bg-card2:       #111827;
      --bg-glass:       rgba(255,255,255,0.03);
      --border:         rgba(255,255,255,0.08);
      --border-bright:  rgba(99,179,237,0.35);
      --text-primary:   #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted:     #4a5568;
      --accent-blue:    #63b3ed;
      --accent-cyan:    #00d9ff;
      --accent-green:   #48bb78;
      --accent-orange:  #ed8936;
      --accent-red:     #fc8181;
      --accent-purple:  #b794f4;
      --accent-gold:    #f6e05e;
      --lfp-color:      #48bb78;
      --nmc-color:      #63b3ed;
      --lead-color:     #94a3b8;
      --nicad-color:    #ed8936;
      --nimh-color:     #b794f4;
      --nca-color:      #fc8181;
      --font-mono:      'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --font-sans:      'Inter', 'Segoe UI', system-ui, sans-serif;
      --radius-sm:      6px;
      --radius-md:      12px;
      --radius-lg:      20px;
      --shadow-glow:    0 0 40px rgba(99,179,237,0.12);
      --transition:     all 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    /* ============================================================
       BASE TYPOGRAPHY & SCROLLBAR
    ============================================================ */
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.7;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 3px; }
    ::selection { background: rgba(99,179,237,0.25); color: #fff; }

    h1, h2, h3, h4, h5 {
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    p { margin-bottom: 1.2rem; color: var(--text-secondary); }
    strong { color: var(--text-primary); font-weight: 600; }
    em { color: var(--accent-cyan); font-style: italic; }
    code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: rgba(99,179,237,0.12);
      color: var(--accent-cyan);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(99,179,237,0.2);
    }
    a { color: var(--accent-blue); text-decoration: none; }
    a:hover { color: var(--accent-cyan); }
