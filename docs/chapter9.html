<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Chapter 9: BMS Firmware Architecture | LFP BMS Knowledge Base</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#050507;--bg2:#080810;--bg3:#0c0c18;
  --cyan:#00F5FF;--blue:#0A84FF;--green:#00FF88;
  --amber:#FFC857;--red:#FF2D55;--purple:#BF5AF2;
  --text:#EAEAEA;--muted:rgba(234,234,234,0.5);
  --border:rgba(0,245,255,0.14);--border2:rgba(0,245,255,0.07);
  --panel:rgba(0,245,255,0.03);
  --acc:#00FF88;--acc-rgb:0,255,136;
  --head:'Orbitron',sans-serif;--mono:'JetBrains Mono',monospace;--body:'Space Grotesk',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.7;display:flex;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,136,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);pointer-events:none;z-index:1;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:rgba(0,255,136,0.3);}

.page-wrapper{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr;min-height:100vh;}
#ch-topbar{grid-column:1/-1;grid-row:1;position:sticky;top:0;z-index:9000;}
.sidebar{grid-column:1;grid-row:2;background:var(--bg);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;padding:1.5rem 0;align-self:start;}
.sidebar-logo{padding:0 1.2rem 1.2rem;border-bottom:1px solid var(--border2);margin-bottom:1rem;}
.sidebar-logo-text{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.15em;color:var(--acc);text-transform:uppercase;font-weight:600;}
.sidebar-title{font-size:0.78rem;color:var(--text);font-weight:600;margin-top:0.3rem;}
.sidebar-nav-label{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.2em;color:rgba(0,255,136,0.4);text-transform:uppercase;padding:0 1.2rem;margin:1.2rem 0 0.4rem;}
.sidebar-link{display:flex;align-items:center;gap:0.5rem;padding:0.4rem 1.2rem;font-family:var(--mono);font-size:0.7rem;color:var(--muted);text-decoration:none;border-left:2px solid transparent;transition:all 0.15s;letter-spacing:0.04em;}
.sidebar-link:hover{color:var(--acc);border-left-color:var(--acc);background:rgba(0,255,136,0.04);}
.sidebar-link.active{color:var(--acc);border-left-color:var(--acc);background:rgba(0,255,136,0.06);}
.sidebar-link .dot{width:4px;height:4px;border-radius:50%;background:rgba(0,255,136,0.35);flex-shrink:0;}
.sidebar-link.active .dot{background:var(--acc);box-shadow:0 0 6px var(--acc);}
.sidebar-sub{padding-left:2.2rem;font-size:0.66rem;}
.main-content{grid-column:2;grid-row:2;min-width:0;}
#hud-progress{position:fixed;top:0;left:0;height:2px;width:0%;background:linear-gradient(90deg,var(--acc),var(--cyan));z-index:9999;box-shadow:0 0 8px var(--acc);pointer-events:none;}


/* chunk3: hero + section CSS */
.hero{background:linear-gradient(180deg,rgba(0,255,136,0.06) 0%,transparent 100%);border-bottom:1px solid rgba(0,255,136,0.15);padding:5rem 3rem 3rem;position:relative;}
.hero-eyebrow{font-family:var(--mono);font-size:0.68rem;letter-spacing:0.25em;color:var(--acc);text-transform:uppercase;margin-bottom:1rem;opacity:0.85;}
.hero-title{font-family:var(--head);font-size:clamp(1.8rem,5vw,3.2rem);font-weight:900;letter-spacing:0.04em;color:#fff;text-shadow:0 0 40px rgba(0,255,136,0.3);margin-bottom:0.6rem;}
.hero-subtitle{font-size:1.05rem;color:var(--muted);max-width:640px;line-height:1.7;margin-bottom:2rem;}
.hero-stats{display:flex;gap:2.5rem;flex-wrap:wrap;}
.hero-stat{font-family:var(--mono);font-size:0.75rem;color:rgba(0,255,136,0.7);letter-spacing:0.1em;}
.hero-stat span{display:block;font-size:1.6rem;font-family:var(--head);color:var(--acc);font-weight:700;line-height:1.1;}
.section{padding:3.5rem 3rem;border-bottom:1px solid var(--border2);}
.section-eyebrow{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.25em;color:var(--acc);text-transform:uppercase;opacity:0.7;margin-bottom:0.6rem;}
.section-title{font-family:var(--head);font-size:clamp(1.2rem,3vw,1.9rem);font-weight:700;color:#fff;margin-bottom:0.4rem;letter-spacing:0.02em;}
.section-intro{color:var(--muted);font-size:0.95rem;line-height:1.75;max-width:780px;margin-bottom:2rem;}
h3.sub-title{font-family:var(--head);font-size:1.05rem;font-weight:600;color:var(--acc);margin:2rem 0 0.8rem;letter-spacing:0.03em;}
p{color:var(--text);line-height:1.8;margin-bottom:1rem;}


/* chunk4: callouts, code, tables */
pre,code{font-family:var(--mono);}
pre{background:rgba(0,0,0,0.55);border:1px solid rgba(0,255,136,0.18);border-radius:6px;padding:1.4rem 1.6rem;overflow-x:auto;font-size:0.78rem;line-height:1.7;color:#c8f0d8;margin:1.2rem 0;}
code{background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);border-radius:3px;padding:0.1em 0.4em;font-size:0.82em;color:var(--acc);}
pre code{background:none;border:none;padding:0;color:inherit;}
.callout{border-radius:6px;padding:1.1rem 1.4rem;margin:1.2rem 0;border-left:3px solid;backdrop-filter:blur(6px);}
.callout-info{background:rgba(10,132,255,0.07);border-color:var(--blue);}
.callout-warn{background:rgba(255,200,87,0.07);border-color:var(--amber);}
.callout-danger{background:rgba(255,60,60,0.08);border-color:#FF453A;}
.callout-success{background:rgba(0,255,136,0.06);border-color:var(--acc);}
.callout-title{font-family:var(--mono);font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;margin-bottom:0.4rem;}
.callout-info .callout-title{color:var(--blue);}
.callout-warn .callout-title{color:var(--amber);}
.callout-danger .callout-title{color:#FF453A;}
.callout-success .callout-title{color:var(--acc);}
.callout p{margin:0;font-size:0.88rem;line-height:1.6;}
table{width:100%;border-collapse:collapse;margin:1.2rem 0;font-size:0.84rem;}
th{font-family:var(--mono);font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--acc);border-bottom:1px solid rgba(0,255,136,0.3);padding:0.6rem 0.8rem;text-align:left;}
td{padding:0.55rem 0.8rem;border-bottom:1px solid var(--border2);color:var(--text);}
tr:hover td{background:rgba(0,255,136,0.03);}
.badge{display:inline-block;font-family:var(--mono);font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.15em 0.5em;border-radius:3px;font-weight:700;}
.badge-green{background:rgba(0,255,136,0.15);color:var(--acc);border:1px solid rgba(0,255,136,0.3);}
.badge-amber{background:rgba(255,200,87,0.15);color:var(--amber);border:1px solid rgba(255,200,87,0.3);}
.badge-blue{background:rgba(10,132,255,0.15);color:var(--blue);border:1px solid rgba(10,132,255,0.3);}

</style>
</head>
<body>
<p id="boot">// CH9 LOADING...</p>
</body>
</html>
