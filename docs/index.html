<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LFP BMS // JARVIS INTERFACE v2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #050507;
  --bg2:      #080810;
  --bg3:      #0c0c18;
  --panel:    rgba(0,245,255,0.03);
  --border:   rgba(0,245,255,0.18);
  --border2:  rgba(0,245,255,0.08);
  --cyan:     #00F5FF;
  --blue:     #0A84FF;
  --amber:    #FFC857;
  --green:    #00FF88;
  --red:      #FF2D55;
  --text:     #EAEAEA;
  --muted:    rgba(234,234,234,0.45);
  --mono:     'JetBrains Mono', monospace;
  --head:     'Orbitron', sans-serif;
  --body:     'Space Grotesk', sans-serif;
  --glow:     0 0 20px rgba(0,245,255,0.25);
  --glow-lg:  0 0 40px rgba(0,245,255,0.3);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.7;
  overflow-x: hidden;
}
/* micro grid bg */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none; z-index:0;
}
</style>
</head>
