<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LFP BMS Knowledge Base ⚡ The Ultimate 7-Chapter Reference</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Space+Grotesk:wght@400;500;700;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;--surface:#0f0f1a;--surface2:#141425;
  --pink:#ff006e;--cyan:#00f5ff;--lime:#aaff00;--orange:#ff6b00;--purple:#b44eff;
  --gold:#fbbf24;--text:#f0f0ff;--muted:#8888aa;--border:#2a2a4a;
  --comic-border:3px solid #fff;--thick-border:5px solid #fff;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow-x:hidden}

/* SCROLL PROGRESS */
#scroll-progress{position:fixed;top:0;left:0;height:4px;width:0%;background:linear-gradient(90deg,var(--pink),var(--cyan),var(--lime));z-index:9999;transition:width 0.1s}

/* PARTICLES */
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;border-radius:50%;animation:float-particle linear infinite}
@keyframes float-particle{0%{transform:translateY(100vh) rotate(0deg);opacity:1}100%{transform:translateY(-100px) rotate(720deg);opacity:0}}

/* SCANLINES */
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:1;animation:scanline 8s linear infinite}
@keyframes scanline{0%{background-position:0 0}100%{background-position:0 100px}}

/* HERO */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative;z-index:2;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(180,78,255,.15),transparent 70%),radial-gradient(ellipse at 20% 80%,rgba(0,245,255,.08),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(255,0,110,.08),transparent 50%);pointer-events:none}

/* SPEED LINES */
.speed-lines{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.speed-line{position:absolute;top:50%;left:50%;height:2px;transform-origin:left center;animation:shoot-line 1.5s ease-out forwards;opacity:0}
@keyframes shoot-line{0%{width:0;opacity:.8}100%{width:200vw;opacity:0}}

/* GLITCH TEXT */
.glitch{position:relative;font-family:'Bangers',cursive;font-size:clamp(3rem,12vw,9rem);letter-spacing:0.05em;color:#fff;text-shadow:0 0 40px rgba(180,78,255,.5);line-height:1}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%}
.glitch::before{color:var(--pink);clip-path:polygon(0 20%,100% 20%,100% 40%,0 40%);animation:glitch-1 3s infinite}
.glitch::after{color:var(--cyan);clip-path:polygon(0 60%,100% 60%,100% 80%,0 80%);animation:glitch-2 3s infinite}
@keyframes glitch-1{0%,90%,100%{transform:translate(0)}91%{transform:translate(-4px,2px)}95%{transform:translate(4px,-2px)}}
@keyframes glitch-2{0%,90%,100%{transform:translate(0)}91%{transform:translate(4px,-2px)}95%{transform:translate(-4px,2px)}}

.hero-sub{font-size:clamp(1rem,3vw,1.4rem);color:var(--muted);margin:1.5rem 0 2.5rem;max-width:600px;line-height:1.6}
.hero-badge{display:inline-block;background:var(--pink);color:#fff;font-family:'Bangers',cursive;font-size:1rem;letter-spacing:.1em;padding:0.3rem 1rem;border-radius:4px;margin-bottom:1rem;animation:pulse-badge 2s ease infinite}
@keyframes pulse-badge{0%,100%{box-shadow:0 0 0 0 rgba(255,0,110,.4)}50%{box-shadow:0 0 0 12px rgba(255,0,110,0)}}

/* STATS GRID */
.stats-grid{display:flex;gap:2rem;flex-wrap:wrap;justify-content:center;margin:2rem 0}
.stat-box{background:var(--surface2);border:3px solid;border-radius:4px;padding:1rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.stat-box::before{content:'';position:absolute;inset:0;opacity:.05;background:currentColor}
.stat-box.s1{border-color:var(--pink);color:var(--pink)}
.stat-box.s2{border-color:var(--cyan);color:var(--cyan)}
.stat-box.s3{border-color:var(--lime);color:var(--lime)}
.stat-box.s4{border-color:var(--purple);color:var(--purple)}
.stat-num{font-family:'Bangers',cursive;font-size:3rem;display:block;line-height:1}
.stat-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* SEARCH */
.search-wrap{position:relative;width:min(500px,90vw);margin:2rem auto}
.search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--cyan);font-size:1.2rem}
#search{width:100%;background:var(--surface2);border:2px solid var(--cyan);border-radius:0;padding:.9rem 1rem .9rem 3rem;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:1rem;outline:none;transition:border-color .2s,box-shadow .2s}
#search::placeholder{color:var(--muted)}
#search:focus{border-color:var(--pink);box-shadow:0 0 20px rgba(255,0,110,.3)}
#search-label{font-family:'Bangers',cursive;font-size:.9rem;letter-spacing:.15em;color:var(--cyan);position:absolute;top:-1.5rem;left:0}

/* MAIN CONTAINER */
.container{max-width:1200px;margin:0 auto;padding:0 1.5rem;position:relative;z-index:2}

/* SECTION HEADERS */
.section-header{text-align:center;margin:4rem 0 2.5rem;position:relative}
.section-header h2{font-family:'Bangers',cursive;font-size:clamp(2.5rem,7vw,5rem);letter-spacing:.05em;line-height:1}
.section-header .section-tag{font-size:.8rem;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);margin-bottom:.5rem}
.zigzag{height:8px;background:repeating-linear-gradient(90deg,var(--pink) 0,var(--pink) 10px,transparent 10px,transparent 20px,var(--cyan) 20px,var(--cyan) 30px,transparent 30px,transparent 40px);margin:1rem auto;width:200px}

/* CHAPTER CARDS — COMIC STYLE */
.chapters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem;margin-bottom:4rem}
.chapter-card{border:4px solid #fff;border-radius:0;background:var(--surface);position:relative;overflow:hidden;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.chapter-card:hover{transform:translate(-4px,-4px) rotate(-0.5deg);box-shadow:8px 8px 0 #fff}
.chapter-card.hidden{display:none}

.card-top{padding:1.5rem;position:relative;clip-path:polygon(0 0,100% 0,100% 85%,95% 100%,0 100%)}
.card-num{font-family:'Bangers',cursive;font-size:5rem;line-height:1;opacity:.15;position:absolute;right:1rem;top:.5rem}
.card-badge{font-family:'Bangers',cursive;font-size:.8rem;letter-spacing:.1em;padding:.2rem .8rem;border:2px solid currentColor;display:inline-block;margin-bottom:.8rem;border-radius:2px}
.card-title{font-family:'Bangers',cursive;font-size:2rem;letter-spacing:.05em;line-height:1.1;margin-bottom:.5rem}
.card-tagline{font-size:.85rem;color:rgba(255,255,255,.7);line-height:1.5}

.card-topics{padding:.8rem 1.5rem;border-top:2px dashed rgba(255,255,255,.2);flex:1}
.topic-list{list-style:none;display:flex;flex-wrap:wrap;gap:.4rem}
.topic-chip{font-size:.72rem;padding:.2rem .6rem;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:2px;color:var(--muted)}

.card-footer{padding:1rem 1.5rem;border-top:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:space-between}
.read-time{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.cta{font-family:'Bangers',cursive;font-size:1rem;letter-spacing:.1em;padding:.4rem 1.2rem;border:2px solid currentColor;border-radius:2px;transition:background .15s,color .15s}
.chapter-card:hover .cta{background:currentColor;color:#000}

/* Chapter color themes */
.ch1{border-color:#fbbf24;color:#fbbf24}.ch1 .card-top{background:linear-gradient(135deg,#1a1000,#0f0f0a)}
.ch2{border-color:#60a5fa;color:#60a5fa}.ch2 .card-top{background:linear-gradient(135deg,#00081a,#0a0f1a)}
.ch3{border-color:#fb923c;color:#fb923c}.ch3 .card-top{background:linear-gradient(135deg,#1a0500,#0f0a08)}
.ch4{border-color:#22d3ee;color:#22d3ee}.ch4 .card-top{background:linear-gradient(135deg,#001a1a,#080f12)}
.ch5{border-color:#34d399;color:#34d399}.ch5 .card-top{background:linear-gradient(135deg,#001a0a,#080f0c)}
.ch6{border-color:#c4b5fd;color:#c4b5fd}.ch6 .card-top{background:linear-gradient(135deg,#0f001a,#0d0a12)}
.ch7{border-color:#fde68a;color:#fde68a;border-width:5px}.ch7 .card-top{background:linear-gradient(135deg,#1a1200,#0f0f08)}

/* HALFTONE SECTION BG */
.halftone-bg{background-image:radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1px);background-size:20px 20px;padding:3rem 0}

/* POV SECTION */
.pov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.2rem;margin-bottom:4rem}
.pov-card{border:3px solid var(--border);background:var(--surface2);padding:1.5rem;position:relative;text-decoration:none;color:inherit;transition:transform .2s,border-color .2s}
.pov-card::before{content:'COMING SOON';position:absolute;top:1rem;right:1rem;font-family:'Bangers',cursive;font-size:.75rem;letter-spacing:.1em;color:var(--muted);border:1px solid var(--muted);padding:.1rem .5rem}
.pov-card:hover{transform:translate(-3px,-3px);border-color:var(--pink)}
.pov-icon{font-size:2.5rem;margin-bottom:.8rem}
.pov-title{font-family:'Bangers',cursive;font-size:1.6rem;letter-spacing:.05em;margin-bottom:.4rem}
.pov-desc{font-size:.82rem;color:var(--muted);line-height:1.5}

/* KNOWLEDGE MAP */
.knowledge-map-section{background:var(--surface);border-top:4px solid;border-image:linear-gradient(90deg,var(--pink),var(--cyan),var(--lime)) 1;padding:3rem 0}

/* BACK TO TOP */
#back-to-top{position:fixed;bottom:2rem;right:2rem;background:var(--pink);color:#fff;border:3px solid #fff;width:50px;height:50px;font-family:'Bangers',cursive;font-size:1.5rem;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:999;transition:transform .2s}
#back-to-top:hover{transform:scale(1.1) rotate(5deg)}
#back-to-top.visible{display:flex}

/* FOOTER */
.site-footer{background:var(--surface);border-top:4px solid;border-image:linear-gradient(90deg,var(--pink),var(--cyan)) 1;padding:3rem 1.5rem;text-align:center}
.footer-logo{font-family:'Bangers',cursive;font-size:3rem;letter-spacing:.1em;background:linear-gradient(135deg,var(--pink),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.footer-sub{color:var(--muted);font-size:.85rem;margin-top:.5rem}

/* PROGRESS BAR */
.progress-section{background:var(--surface2);border:3px solid var(--lime);padding:1.5rem;margin:2rem 0;position:relative}
.progress-section::before{content:'COMPLETION STATUS';font-family:'Bangers',cursive;font-size:.8rem;letter-spacing:.15em;color:var(--lime);position:absolute;top:-.7rem;left:1rem;background:var(--surface2);padding:0 .5rem}
.progress-track{height:12px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);overflow:hidden;margin:.8rem 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--orange),var(--lime));width:0;transition:width 2s cubic-bezier(.16,1,.3,1)}
.progress-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}

/* ANIMATIONS */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .6s ease}
.reveal.visible{opacity:1;transform:none}

/* COMIC EFFECTS */
.boom{font-family:'Bangers',cursive;display:inline-block;color:var(--pink);font-size:1.2rem;animation:boom-anim 1s ease infinite alternate}
@keyframes boom-anim{0%{transform:scale(1) rotate(-3deg)}100%{transform:scale(1.05) rotate(3deg)}}

@media(max-width:640px){.chapters-grid{grid-template-columns:1fr}.stats-grid{gap:1rem}.glitch{font-size:clamp(2.5rem,15vw,5rem)}}
</style>
</head>
<body>
