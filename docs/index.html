<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LFP BMS // JARVIS INTERFACE v2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #050507;
  --bg2:      #080810;
  --bg3:      #0c0c18;
  --panel:    rgba(0,245,255,0.03);
  --border:   rgba(0,245,255,0.18);
  --border2:  rgba(0,245,255,0.08);
  --cyan:     #00F5FF;
  --blue:     #0A84FF;
  --amber:    #FFC857;
  --green:    #00FF88;
  --red:      #FF2D55;
  --text:     #EAEAEA;
  --muted:    rgba(234,234,234,0.45);
  --mono:     'JetBrains Mono', monospace;
  --head:     'Orbitron', sans-serif;
  --body:     'Space Grotesk', sans-serif;
  --glow:     0 0 20px rgba(0,245,255,0.25);
  --glow-lg:  0 0 40px rgba(0,245,255,0.3);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.7;
  overflow-x: hidden;
}
/* micro grid bg */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none; z-index:0;
}

/* scanlines */
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);pointer-events:none;z-index:1;}
/* scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,245,255,0.3);border-radius:2px;}
/* scroll progress */
#hud-progress{position:fixed;top:0;left:0;height:2px;width:0%;background:linear-gradient(90deg,var(--cyan),var(--blue));z-index:9999;transition:width 0.1s;box-shadow:0 0 8px var(--cyan);}
/* topbar */
#topbar{position:fixed;top:0;left:0;width:100%;background:rgba(5,5,7,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border2);padding:0 2rem;height:48px;display:flex;align-items:center;justify-content:space-between;z-index:900;font-family:var(--mono);font-size:0.7rem;}
.topbar-left{color:var(--cyan);letter-spacing:0.12em;}
.topbar-right{display:flex;gap:1.5rem;}
.topbar-chip{color:var(--muted);letter-spacing:0.1em;padding:0.2rem 0.6rem;border:1px solid var(--border2);font-size:0.65rem;}
.topbar-chip.online{color:var(--green);border-color:rgba(0,255,136,0.3);}


/* hero */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6rem 2rem 4rem;position:relative;z-index:2;}
.hero-eyebrow{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.25em;color:var(--cyan);opacity:0.7;margin-bottom:1.5rem;text-transform:uppercase;}
.hero-title{font-family:var(--head);font-size:clamp(3rem,9vw,7rem);font-weight:900;letter-spacing:0.04em;line-height:1;color:#fff;text-shadow:0 0 60px rgba(0,245,255,0.4);margin-bottom:0.5rem;}
.hero-title span{color:var(--cyan);text-shadow:var(--glow-lg);}
.hero-sub-title{font-family:var(--head);font-size:clamp(1rem,3vw,1.8rem);font-weight:400;letter-spacing:0.15em;color:rgba(0,245,255,0.6);margin-bottom:2rem;}
.hero-desc{max-width:600px;color:var(--muted);font-size:0.95rem;line-height:1.8;margin-bottom:3rem;}
/* hero corner brackets */
.hero-panel{position:relative;padding:2rem;border:1px solid var(--border2);}
.hero-panel::before,.hero-panel::after{content:'';position:absolute;width:20px;height:20px;border-color:var(--cyan);border-style:solid;}
.hero-panel::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
.hero-panel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}
/* stats row */
.hero-stats{display:flex;gap:0;border:1px solid var(--border);margin-bottom:2.5rem;overflow:hidden;}
.hstat{padding:1.2rem 2rem;text-align:center;border-right:1px solid var(--border);position:relative;background:var(--panel);flex:1;}
.hstat:last-child{border-right:none;}
.hstat-val{font-family:var(--head);font-size:2rem;font-weight:700;color:var(--cyan);display:block;line-height:1;text-shadow:var(--glow);}
.hstat-lbl{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;margin-top:0.3rem;display:block;}

</style>
</head>
<body>
<!-- PLACEHOLDER - building in chunks -->
<div style="color:#00F5FF;font-family:monospace;padding:2rem;">SYSTEM INITIALIZING...</div>
</body>
</html>
