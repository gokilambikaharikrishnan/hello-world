<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Chapter 8: BMS Hardware Design | LFP BMS Knowledge Base</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#050507; --bg2:#080810; --bg3:#0c0c18;
  --cyan:#00F5FF; --blue:#0A84FF; --amber:#FFC857;
  --green:#00FF88; --red:#FF2D55; --purple:#BF5AF2;
  --text:#EAEAEA; --muted:rgba(234,234,234,0.5);
  --border:rgba(0,245,255,0.14); --border2:rgba(0,245,255,0.07);
  --panel:rgba(0,245,255,0.03);
  --glow:0 0 20px rgba(0,245,255,0.2);
  --head:'Orbitron',sans-serif; --mono:'JetBrains Mono',monospace; --body:'Space Grotesk',sans-serif;
  --accent:#FFC857; --accent-rgb:255,200,87;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.7;display:flex;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,200,87,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,200,87,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);pointer-events:none;z-index:1;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:rgba(255,200,87,0.3);}

.page-wrapper{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr;min-height:100vh;}
#ch-topbar{grid-column:1/-1;grid-row:1;position:sticky;top:0;z-index:9000;}
.sidebar{grid-column:1;grid-row:2;background:var(--bg);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;padding:1.5rem 0;align-self:start;}
.sidebar-logo{padding:0 1.2rem 1.2rem;border-bottom:1px solid var(--border2);margin-bottom:1rem;}
.sidebar-logo-text{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.15em;color:var(--amber);text-transform:uppercase;font-weight:600;}
.sidebar-title{font-size:0.78rem;color:var(--text);font-weight:600;margin-top:0.3rem;}
.sidebar-nav-label{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.2em;color:rgba(255,200,87,0.4);text-transform:uppercase;padding:0 1.2rem;margin:1.2rem 0 0.4rem;}
.sidebar-link{display:flex;align-items:center;gap:0.5rem;padding:0.4rem 1.2rem;font-family:var(--mono);font-size:0.7rem;color:var(--muted);text-decoration:none;border-left:2px solid transparent;transition:all 0.15s;letter-spacing:0.04em;}
.sidebar-link:hover{color:var(--amber);border-left-color:var(--amber);background:rgba(255,200,87,0.05);}
.sidebar-link.active{color:var(--amber);border-left-color:var(--amber);background:rgba(255,200,87,0.07);}
.sidebar-link .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,200,87,0.35);flex-shrink:0;}
.sidebar-link.active .dot{background:var(--amber);box-shadow:0 0 6px var(--amber);}
.sidebar-sub{padding-left:2.2rem;font-size:0.67rem;}
.main-content{grid-column:2;grid-row:2;min-width:0;overflow-x:hidden;}


#hud-progress{position:fixed;top:0;left:0;height:2px;width:0%;background:linear-gradient(90deg,var(--amber),var(--cyan));z-index:9999;box-shadow:0 0 8px var(--amber);pointer-events:none;}
.hero{background:linear-gradient(180deg,rgba(255,200,87,0.06) 0%,transparent 100%);border-bottom:1px solid rgba(255,200,87,0.15);padding:5rem 3rem 3rem;position:relative;}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent);}
.hero-badge{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.2em;background:rgba(255,200,87,0.08);border:1px solid rgba(255,200,87,0.3);color:var(--amber);padding:0.3rem 0.9rem;display:inline-block;margin-bottom:0.8rem;}
.hero-chapter{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.2em;color:rgba(255,200,87,0.45);margin:0.5rem 0;}
.hero-title{font-family:var(--head);font-size:clamp(1.8rem,5vw,3.2rem);font-weight:900;letter-spacing:0.04em;color:#fff;text-shadow:0 0 40px rgba(255,200,87,0.3),0 0 80px rgba(0,245,255,0.1);line-height:1.1;margin-bottom:1rem;}
.hero-subtitle{font-size:0.9rem;color:var(--muted);max-width:700px;line-height:1.85;border-left:2px solid rgba(255,200,87,0.3);padding-left:1rem;margin-bottom:2rem;}
.hero-stats{display:flex;gap:0;border:1px solid var(--border);background:var(--panel);}
.hstat{padding:1rem 1.5rem;text-align:center;border-right:1px solid var(--border);flex:1;}
.hstat:last-child{border-right:none;}
.hstat-val{font-family:var(--head);font-size:1.6rem;font-weight:700;color:var(--amber);display:block;line-height:1;text-shadow:0 0 15px rgba(255,200,87,0.4);}
.hstat-lbl{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;margin-top:0.3rem;display:block;}
.section{padding:3rem;border-top:1px solid var(--border2);}
.section-tag{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.2em;color:rgba(255,200,87,0.5);display:block;margin-bottom:0.4rem;}
.section-title{font-family:var(--head);font-size:clamp(1.2rem,3vw,1.9rem);font-weight:700;letter-spacing:0.05em;color:#fff;text-shadow:0 0 25px rgba(255,200,87,0.2);margin-bottom:1.5rem;}
.subsection-title{font-family:var(--head);font-size:1rem;font-weight:600;color:var(--amber);letter-spacing:0.06em;margin:2rem 0 1rem;}
p{color:var(--muted);font-size:0.88rem;line-height:1.85;margin-bottom:1rem;}
strong{color:var(--text);font-weight:500;}


.callout{border-radius:0;padding:1.2rem 1.5rem;margin:1.5rem 0;position:relative;backdrop-filter:blur(8px);}
.callout-info{border:1px solid rgba(0,245,255,0.28);background:rgba(0,245,255,0.04);}
.callout-warning{border:1px solid rgba(255,200,87,0.35);background:rgba(255,200,87,0.05);}
.callout-danger{border:1px solid rgba(255,45,85,0.32);background:rgba(255,45,85,0.05);}
.callout-success{border:1px solid rgba(0,255,136,0.28);background:rgba(0,255,136,0.04);}
.callout-tag{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.18em;text-transform:uppercase;font-weight:600;margin-bottom:0.5rem;display:block;}
.callout-info .callout-tag{color:var(--cyan);}
.callout-warning .callout-tag{color:var(--amber);}
.callout-danger .callout-tag{color:var(--red);}
.callout-success .callout-tag{color:var(--green);}
table{border-collapse:collapse;width:100%;border:1px solid var(--border);margin:1.5rem 0;}
th{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;background:rgba(255,200,87,0.08);color:var(--amber);padding:0.65rem 1rem;font-weight:500;border-bottom:1px solid rgba(255,200,87,0.2);}
td{font-size:0.82rem;padding:0.6rem 1rem;border-bottom:1px solid var(--border2);color:rgba(234,234,234,0.7);}
tr:hover td{background:rgba(255,200,87,0.03);}
.good{color:var(--green);}.warn{color:var(--amber);}.bad{color:var(--red);}.best{color:var(--cyan);}
code{font-family:var(--mono);background:rgba(0,245,255,0.06);color:var(--cyan);padding:2px 6px;border:1px solid rgba(0,245,255,0.15);font-size:0.82em;}
pre{font-family:var(--mono);background:var(--bg2);border:1px solid var(--border);border-left:2px solid var(--amber);padding:1.5rem;color:rgba(255,200,87,0.85);font-size:0.78rem;overflow-x:auto;margin:1.5rem 0;}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--border2);border:1px solid var(--border);margin:1.5rem 0;}
.spec-card{background:var(--bg2);padding:1.4rem;transition:background 0.2s;}
.spec-card:hover{background:var(--bg3);}
.spec-card-title{font-family:var(--head);font-size:0.82rem;font-weight:600;color:var(--amber);letter-spacing:0.06em;margin-bottom:0.5rem;}
.spec-card-val{font-family:var(--mono);font-size:1.2rem;font-weight:600;color:#fff;margin-bottom:0.3rem;}
.spec-card-desc{font-size:0.78rem;color:var(--muted);line-height:1.6;}
.chip{font-family:var(--mono);font-size:0.62rem;padding:0.15rem 0.55rem;border:1px solid var(--border);color:var(--muted);display:inline-block;margin:0.15rem;}
.chip.good{border-color:rgba(0,255,136,0.3);color:var(--green);}
.chip.warn{border-color:rgba(255,200,87,0.3);color:var(--amber);}
.chip.bad{border-color:rgba(255,45,85,0.3);color:var(--red);}
.chapter-footer{background:var(--bg);border-top:1px solid var(--border);padding:2rem 3rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.nav-btn{font-family:var(--mono);font-size:0.68rem;letter-spacing:0.12em;padding:0.55rem 1.2rem;border:1px solid rgba(255,200,87,0.3);color:var(--amber);background:rgba(255,200,87,0.04);text-decoration:none;transition:all 0.2s;}
.nav-btn:hover{background:rgba(255,200,87,0.1);box-shadow:0 0 18px rgba(255,200,87,0.15);}
.reveal{opacity:0;transform:translateY(14px);transition:opacity 0.5s,transform 0.5s;}
.reveal.visible{opacity:1;transform:none;}

</style>
</head>
<body>
<p style="color:#FFC857;font-family:monospace;padding:2rem;z-index:10;position:relative;">// CHAPTER 8 LOADING...</p>
</body>
</html>
