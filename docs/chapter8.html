<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Chapter 8: BMS Hardware Design | LFP BMS Knowledge Base</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#050507; --bg2:#080810; --bg3:#0c0c18;
  --cyan:#00F5FF; --blue:#0A84FF; --amber:#FFC857;
  --green:#00FF88; --red:#FF2D55; --purple:#BF5AF2;
  --text:#EAEAEA; --muted:rgba(234,234,234,0.5);
  --border:rgba(0,245,255,0.14); --border2:rgba(0,245,255,0.07);
  --panel:rgba(0,245,255,0.03);
  --glow:0 0 20px rgba(0,245,255,0.2);
  --head:'Orbitron',sans-serif; --mono:'JetBrains Mono',monospace; --body:'Space Grotesk',sans-serif;
  --accent:#FFC857; --accent-rgb:255,200,87;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.7;display:flex;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,200,87,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,200,87,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);pointer-events:none;z-index:1;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:rgba(255,200,87,0.3);}
</style>
</head>

</body>
