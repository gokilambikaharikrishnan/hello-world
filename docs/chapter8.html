<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Chapter 8: BMS Hardware Design | LFP BMS Knowledge Base</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#050507; --bg2:#080810; --bg3:#0c0c18;
  --cyan:#00F5FF; --blue:#0A84FF; --amber:#FFC857;
  --green:#00FF88; --red:#FF2D55; --purple:#BF5AF2;
  --text:#EAEAEA; --muted:rgba(234,234,234,0.5);
  --border:rgba(0,245,255,0.14); --border2:rgba(0,245,255,0.07);
  --panel:rgba(0,245,255,0.03);
  --glow:0 0 20px rgba(0,245,255,0.2);
  --head:'Orbitron',sans-serif; --mono:'JetBrains Mono',monospace; --body:'Space Grotesk',sans-serif;
  --accent:#FFC857; --accent-rgb:255,200,87;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.7;display:flex;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,200,87,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,200,87,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);pointer-events:none;z-index:1;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:rgba(255,200,87,0.3);}

.page-wrapper{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr;min-height:100vh;}
#ch-topbar{grid-column:1/-1;grid-row:1;position:sticky;top:0;z-index:9000;}
.sidebar{grid-column:1;grid-row:2;background:var(--bg);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;padding:1.5rem 0;align-self:start;}
.sidebar-logo{padding:0 1.2rem 1.2rem;border-bottom:1px solid var(--border2);margin-bottom:1rem;}
.sidebar-logo-text{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.15em;color:var(--amber);text-transform:uppercase;font-weight:600;}
.sidebar-title{font-size:0.78rem;color:var(--text);font-weight:600;margin-top:0.3rem;}
.sidebar-nav-label{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.2em;color:rgba(255,200,87,0.4);text-transform:uppercase;padding:0 1.2rem;margin:1.2rem 0 0.4rem;}
.sidebar-link{display:flex;align-items:center;gap:0.5rem;padding:0.4rem 1.2rem;font-family:var(--mono);font-size:0.7rem;color:var(--muted);text-decoration:none;border-left:2px solid transparent;transition:all 0.15s;letter-spacing:0.04em;}
.sidebar-link:hover{color:var(--amber);border-left-color:var(--amber);background:rgba(255,200,87,0.05);}
.sidebar-link.active{color:var(--amber);border-left-color:var(--amber);background:rgba(255,200,87,0.07);}
.sidebar-link .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,200,87,0.35);flex-shrink:0;}
.sidebar-link.active .dot{background:var(--amber);box-shadow:0 0 6px var(--amber);}
.sidebar-sub{padding-left:2.2rem;font-size:0.67rem;}
.main-content{grid-column:2;grid-row:2;min-width:0;overflow-x:hidden;}

</style>
</head>
<body>
<p style="color:#FFC857;font-family:monospace;padding:2rem;z-index:10;position:relative;">// CHAPTER 8 LOADING...</p>
</body>
</html>
